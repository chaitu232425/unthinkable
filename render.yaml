# Render blueprint for the API.
#
# The database lives on MongoDB Atlas rather than here (Render doesn't offer a managed
# Mongo add-on), so MONGODB_URI is supplied as a secret rather than provisioned by this
# file — point it at any Atlas cluster, which is a replica set by default and so
# supports the multi-document transactions this app relies on. Migrations run as part of
# the build step, which means a deploy that cannot migrate never starts serving traffic.

services:
  - type: web
    name: ticket-booking-api
    runtime: node
    region: singapore
    plan: free
    rootDir: .
    # --include=dev is required: NODE_ENV=production is set below (needed at runtime),
    # but npm reads that same env var during `npm ci` and skips devDependencies by
    # default — which is exactly where the build tool (tsup) lives. Without this flag
    # the build fails with "tsup: not found" (reproduced and confirmed locally).
    buildCommand: npm ci --include=dev && npm --workspace backend run build && npm --workspace backend run db:migrate
    startCommand: npm --workspace backend run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000

      # ── secrets: set these in the Render dashboard, never in this file ──
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: TICKET_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false

      - key: MONGODB_DB_NAME
        value: ticket_booking
      - key: EMAIL_TRANSPORT
        value: resend
      - key: EMAIL_FROM
        value: Ticket Booking <onboarding@resend.dev>
      - key: PASSWORD_RESET_TTL_MINUTES
        value: '10'
      - key: PASSWORD_RESET_AUTHORIZATION_TTL_MINUTES
        value: '10'
      - key: EMAIL_VERIFICATION_TTL_MINUTES
        value: '10'
      - key: EMAIL_VERIFICATION_MAX_ATTEMPTS
        value: '5'
      - key: OTP_RESEND_COOLDOWN_SECONDS
        value: '60'

      # Set after both services exist and their real *.onrender.com URLs are known —
      # e.g. CLIENT_URL=https://ticket-booking-web.onrender.com,
      # API_URL=https://ticket-booking-api.onrender.com, CORS_ORIGINS=same as CLIENT_URL.
      # Must include the https:// scheme (env validation requires a full URL) and must
      # match the actual deployed frontend origin exactly, or the refresh cookie
      # (sent with credentials) will be rejected by CORS.
      - key: CLIENT_URL
        sync: false
      - key: API_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false

      - key: DEFAULT_HOLD_TTL
        value: '600'
      - key: DEFAULT_OFFER_TTL
        value: '900'
      - key: CANCEL_CUTOFF_MINUTES
        value: '120'
      - key: JOBS_ENABLED
        value: 'true'
      - key: SWEEPER_INTERVAL_SECONDS
        value: '15'
      - key: OUTBOX_INTERVAL_SECONDS
        value: '10'
      - key: JOB_LOCK_TTL_MS
        value: '60000'
      - key: MONGO_POOL_MAX
        value: '15'

  - type: web
    name: ticket-booking-web
    runtime: static
    rootDir: .
    buildCommand: npm ci && npm --workspace frontend run build
    staticPublishPath: frontend/dist
    routes:
      # Single-page app: every unmatched path must serve index.html, or a hard
      # refresh on e.g. /bookings/:id would 404 instead of letting the SPA router handle it.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Both must be the backend's real https://ticket-booking-api.onrender.com URL —
      # set once that service exists (see the comment on the api service above).
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
